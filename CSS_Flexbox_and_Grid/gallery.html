<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Photo Grid */
        .gallery {
            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
        }

        /* Gallery Item */
        figure {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Images */
        figure img {
            width: 100%;
            height: 250px;

            display: block;

            object-fit: cover;

            transition: transform 0.5s ease;
        }

        /* Hover Zoom */
        figure:hover img {
            transform: scale(1.05);
        }

        /* Caption */
        figcaption {
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="https://picsum.photos/id/1015/500/350"
                 alt="Mountain">
            <figcaption>Beautiful Mountain</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1016/500/350"
                 alt="Nature">
            <figcaption>Nature View</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1025/500/350"
                 alt="Dog">
            <figcaption>Cute Dog</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1035/500/350"
                 alt="River">
            <figcaption>River Landscape</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1043/500/350"
                 alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/106/500/350"
                 alt="Water">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

    </div>

</body>
</html>
