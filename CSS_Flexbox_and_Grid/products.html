<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Grid */
        .product-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            align-items: stretch;
        }

        /* Product Card */
        .product-card {
            background-color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 10px;

            /* Equal height */
            height: 180px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

            transition: 0.3s;
        }

        /* Hover Effect */
        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .product-card p {
            font-size: 18px;
            font-weight: bold;
        }

        /* Tablet - 2 Columns */
        @media (max-width: 900px) {
            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile - 1 Column */
        @media (max-width: 600px) {
            .product-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="product-container">

        <div class="product-card">
            <h2>Laptop</h2>
            <p>₹55,000</p>
        </div>

        <div class="product-card">
            <h2>Smartphone</h2>
            <p>₹25,000</p>
        </div>

        <div class="product-card">
            <h2>Headphones</h2>
            <p>₹2,500</p>
        </div>

        <div class="product-card">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <div class="product-card">
            <h2>Mouse</h2>
            <p>₹800</p>
        </div>

        <div class="product-card">
            <h2>Monitor</h2>
            <p>₹15,000</p>
        </div>

        <div class="product-card">
            <h2>Tablet</h2>
            <p>₹20,000</p>
        </div>

        <div class="product-card">
            <h2>Smartwatch</h2>
            <p>₹4,000</p>
        </div>

    </div>

</body>
</html>
