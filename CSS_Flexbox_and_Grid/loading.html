<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #f4f4f4;
        }

        /* Loading Container */
        .loader {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;
        }

        /* Circles */
        .circle {
            width: 18px;
            height: 18px;

            background-color: #222;

            border-radius: 50%;

            animation: bounce 0.8s ease-in-out infinite;
        }

        /* Animation Delays */
        .circle:nth-child(1) {
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            animation-delay: 0.2s;
        }

        .circle:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Keyframes */
        @keyframes bounce {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="loader">

        <div class="circle"></div>

        <div class="circle"></div>

        <div class="circle"></div>

    </div>

</body>
</html>
