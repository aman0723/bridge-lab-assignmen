
<!DOCTYPE html>
<html>
<body>
    <h2>Update User</h2>

    <form id="userForm">
        <input id="name" placeholder="Name" value="John" required>
        <input id="email" type="email"
               placeholder="Email" value="john@gmail.com" required>
        <input id="age" type="number" placeholder="Age" value="21"
               min="1" required>
        <button type="submit">Update</button>
    </form>

    <h3>Updated Object</h3>
    <pre id="output"></pre>

    <script>
        const user = {
            name: "John",
            email: "john@gmail.com",
            age: 21
        };

        function displayUser() {
            document.getElementById("output").textContent =
                JSON.stringify(user, null, 2);
        }

        displayUser();

        document.getElementById("userForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                user.name = document.getElementById("name").value.trim();
                user.email = document.getElementById("email").value.trim();
                user.age = Number(document.getElementById("age").value);

                displayUser();
            });
    </script>
</body>
</html>
