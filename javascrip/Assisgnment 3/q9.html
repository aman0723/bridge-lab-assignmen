
<!DOCTYPE html>
<html>
<body>
    <h2>Shopping Cart</h2>

    <form id="cartForm">
        <input id="name" placeholder="Product Name" required>
        <input id="price" type="number" placeholder="Price"
               min="0.01" step="0.01" required>
        <input id="quantity" type="number" placeholder="Quantity"
               min="1" step="1" required>
        <button type="submit">Add Item</button>
    </form>

    <h3>Cart Items</h3>
    <ul id="items"></ul>

    <p id="subtotal"></p>

    <input id="coupon" placeholder="Coupon: SAVE20 or DISC10">
    <button id="applyCoupon">Apply Coupon</button>

    <h3 id="total"></h3>
    <p id="message"></p>

    <script>
        class Cart {
            constructor() {
                this.items = [];
                this.discount = 0;
            }

            addItem(name, price, quantity) {
                this.items.push({ name, price, quantity });
            }

            getTotal() {
                return this.items.reduce((sum, item) => {
                    return sum + item.price * item.quantity;
                }, 0);
            }

            applyCoupon(code) {
                if (/^SAVE20$/.test(code)) {
                    this.discount = 20;
                    return true;
                }

                if (/^DISC10$/.test(code)) {
                    this.discount = 10;
                    return true;
                }

                return false;
            }

            getFinalTotal() {
                return this.getTotal() * (1 - this.discount / 100);
            }
        }

        const cart = new Cart();

        function displayCart() {
            const list = document.getElementById("items");
            list.replaceChildren();

            cart.items.forEach(item => {
                const li = document.createElement("li");
                li.textContent =
                    `${item.name} - ₹${item.price} × ${item.quantity} = ₹${(item.price * item.quantity).toFixed(2)}`;
                list.appendChild(li);
            });

            document.getElementById("subtotal").textContent =
                "Subtotal: ₹" + cart.getTotal().toFixed(2);

            document.getElementById("total").textContent =
                "Final Total: ₹" + cart.getFinalTotal().toFixed(2);
        }

        document.getElementById("cartForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const name = document.getElementById("name").value.trim();
                const price = Number(document.getElementById("price").value);
                const quantity = Number(document.getElementById("quantity").value);

                if (!name || !Number.isFinite(price) || price <= 0 ||
                    !Number.isInteger(quantity) || quantity < 1) {
                    alert("Enter valid product details.");
                    return;
                }

                cart.addItem(name, price, quantity);
                displayCart();
                this.reset();
            });

        document.getElementById("applyCoupon")
            .addEventListener("click", function() {
                const code = document.getElementById("coupon")
                    .value.trim();

                const message = document.getElementById("message");

                if (cart.applyCoupon(code)) {
                    message.textContent =
                        `${cart.discount}% discount applied successfully!`;
                    message.style.color = "green";
                } else {
                    message.textContent =
                        "Invalid coupon. Use SAVE20 or DISC10.";
                    message.style.color = "red";
                }

                displayCart();
            });

        displayCart();
    </script>
</body>
</html>
