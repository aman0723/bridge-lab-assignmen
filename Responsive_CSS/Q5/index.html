<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Our Team</h1>

    <div class="profile-container">

        <div class="profile-card">
            <img class="grayscale"
                 src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500"
                 alt="Profile">
            <h2>John Doe</h2>
            <p>Web Developer</p>
        </div>

        <div class="profile-card">
            <img class="sepia"
                 src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500"
                 alt="Profile">
            <h2>Jane Smith</h2>
            <p>UI Designer</p>
        </div>

        <div class="profile-card">
            <img class="grayscale"
                 src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500"
                 alt="Profile">
            <h2>Mike Wilson</h2>
            <p>Software Engineer</p>
        </div>

    </div>

</body>
</html>
