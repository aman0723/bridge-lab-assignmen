<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Responsive Image Filter Gallery</h1>

    <div class="gallery">

        <div class="image-card">
            <img class="blur" 
                 src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=600"
                 alt="Nature">
            <p>Blur Effect</p>
        </div>

        <div class="image-card">
            <img class="grayscale" 
                 src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
                 alt="Mountain">
            <p>Grayscale Effect</p>
        </div>

        <div class="image-card">
            <img class="sepia" 
                 src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                 alt="Landscape">
            <p>Sepia Effect</p>
        </div>

        <div class="image-card">
            <img class="brightness" 
                 src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600"
                 alt="Forest">
            <p>Brightness Effect</p>
        </div>

        <div class="image-card">
            <img class="contrast" 
                 src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=600"
                 alt="Road">
            <p>Contrast Effect</p>
        </div>

        <div class="image-card">
            <img class="hue-rotate" 
                 src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
                 alt="Beach">
            <p>Hue-Rotate Effect</p>
        </div>

    </div>

</body>
</html>
