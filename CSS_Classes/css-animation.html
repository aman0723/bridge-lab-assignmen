<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animation Demonstration</title>

    <style>

        /* ---------------- GENERAL STYLING ---------------- */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;

            /* Center everything horizontally and vertically */
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 40px;
        }


        /* ---------------- ANIMATION AREA ---------------- */

        .animation-area {
            background-color: white;

            min-height: 400px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 45px;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }


        /* ==================================================
           ANIMATION 1 - MOVING BOX
           ================================================== */

        .moving-box {
            width: 80px;
            height: 80px;

            background-color: royalblue;

            border-radius: 10px;

            animation-name: moveBox;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;

            /* Animation repeats continuously */
            animation-iteration-count: infinite;

            /* Moves forward and then backward */
            animation-direction: alternate;
        }


        @keyframes moveBox {

            0% {
                transform: translateX(-200px);
            }

            100% {
                transform: translateX(200px);
            }

        }


        /* ==================================================
           ANIMATION 2 - BOUNCING BALL
           ================================================== */

        .ball {
            width: 60px;
            height: 60px;

            background-color: tomato;

            border-radius: 50%;

            animation-name: bounce;

            animation-duration: 1.5s;

            animation-timing-function: ease-in-out;

            animation-iteration-count: infinite;

            /* Starts after 0.5 seconds */
            animation-delay: 0.5s;
        }


        @keyframes bounce {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-80px);
            }

            100% {
                transform: translateY(0);
            }

        }


        /* ==================================================
           ANIMATION 3 - COLOR CHANGING TEXT
           ================================================== */

        .color-text {

            font-size: 30px;

            font-weight: bold;

            animation-name: changeColor;

            animation-duration: 3s;

            animation-timing-function: ease-in-out;

            animation-iteration-count: infinite;

            /* Demonstrates animation-direction */
            animation-direction: alternate;
        }


        @keyframes changeColor {

            0% {
                color: red;
            }

            50% {
                color: blue;
            }

            100% {
                color: green;
            }

        }


        /* ---------------- LABELS ---------------- */

        .label {
            font-size: 14px;
            color: #555;
            margin-top: -25px;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>CSS Animation Demonstration</h1>

        <p class="description">
            Three different animations using CSS @keyframes
        </p>


        <div class="animation-area">


            <!-- Animation 1 -->

            <div class="moving-box"></div>

            <div class="label">
                Moving Box
            </div>


            <!-- Animation 2 -->

            <div class="ball"></div>

            <div class="label">
                Bouncing Ball
            </div>


            <!-- Animation 3 -->

            <div class="color-text">
                Color Changing Text
            </div>

        </div>

    </div>

</body>

</html>
