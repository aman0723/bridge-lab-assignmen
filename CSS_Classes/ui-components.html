<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UI Components</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Soft background gradient */
            background: linear-gradient(135deg, #e0f2fe, #f3e8ff);

            min-height: 100vh;

            /* Center the card */
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        /* Main Card */

        .card {
            width: 100%;
            max-width: 500px;

            background-color: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;

            gap: 20px;
        }


        h1 {
            margin: 0;
            text-align: center;
            color: #222;
        }


        .description {
            text-align: center;
            color: #666;
            margin: 0;
        }


        /* Search Bar */

        .search {
            display: flex;
            gap: 10px;
        }

        .search input {
            flex: 1;

            padding: 12px;

            border: 2px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }


        /* Focus effect */

        .search input:focus {
            border-color: #6366f1;

            box-shadow: 0 0 5px rgba(99, 102, 241, 0.4);
        }


        /* Search Button */

        .search button {
            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background-color: #6366f1;

            color: white;

            cursor: pointer;

            transition: 0.3s;
        }


        .search button:hover {
            background-color: #4f46e5;
        }


        /* Dropdown */

        label {
            font-weight: bold;
            color: #333;
        }

        select {
            width: 100%;

            padding: 12px;

            border: 2px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

            cursor: pointer;

            transition: 0.3s;
        }


        /* Focus effect on dropdown */

        select:focus {
            border-color: #6366f1;

            box-shadow: 0 0 5px rgba(99, 102, 241, 0.4);
        }


        /* Buttons */

        .buttons {
            display: flex;
            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .btn {
            padding: 12px 25px;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s;
        }


        .primary {
            background-color: #6366f1;

            color: white;

            border: 2px solid #6366f1;
        }


        .primary:hover {
            background-color: #4f46e5;
        }


        .secondary {
            background-color: white;

            color: #6366f1;

            border: 2px solid #6366f1;
        }


        .secondary:hover {
            background-color: #6366f1;

            color: white;
        }


        /* Responsive */

        @media (max-width: 500px) {

            .card {
                padding: 25px;
            }

            .search {
                flex-direction: column;
            }

            .search button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <div class="card">

        <h1>UI Components</h1>

        <p class="description">
            A simple collection of common UI elements
        </p>


        <!-- Search Bar -->

        <div class="search">

            <input
                type="text"
                placeholder="Search something..."
            >

            <button>
                Search
            </button>

        </div>


        <!-- Dropdown -->

        <div>

            <label for="category">
                Select Category
            </label>

            <br><br>

            <select id="category">

                <option value="">
                    Choose a category
                </option>

                <option value="html">
                    HTML
                </option>

                <option value="css">
                    CSS
                </option>

                <option value="javascript">
                    JavaScript
                </option>

                <option value="python">
                    Python
                </option>

            </select>

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <button class="btn primary">
                Submit
            </button>

            <button class="btn secondary">
                Cancel
            </button>

        </div>

    </div>

</body>

</html>
