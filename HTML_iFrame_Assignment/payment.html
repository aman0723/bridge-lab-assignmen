<!DOCTYPE html>
<html>
<head>
    <title>Payment Form</title>
</head>
<body>

    <h2>Payment Form</h2>

    <form>

        <label>Cardholder Name:</label>
        <input
            type="text"
            name="cardholder"
            required>

        <br><br>

        <label>Card Number:</label>
        <input
            type="text"
            name="card_number"
            required>

        <br><br>

        <label>Expiry Date:</label>
        <input
            type="month"
            name="expiry"
            required>

        <br><br>

        <label>CVV:</label>
        <input
            type="password"
            name="cvv"
            maxlength="3"
            required>

        <br><br>

        <input type="submit" value="Pay Now">

    </form>

</body>
</html>
