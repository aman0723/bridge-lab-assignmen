<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

    <h2>Contact Us</h2>

    <form>

        <label>Full Name:</label>
        <input
            type="text"
            name="fullname"
            placeholder="Enter your full name"
            required>

        <br><br>

        <label>Email:</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br><br>

        <label>Subject:</label>
        <input
            type="text"
            name="subject"
            placeholder="Enter subject"
            required>

        <br><br>

        <label>Message:</label>
        <br>

        <textarea
            name="message"
            rows="6"
            cols="40"
            placeholder="Enter your message"
            required>
        </textarea>

        <br><br>

        <input type="submit" value="Send Message">

    </form>

</body>
</html>
