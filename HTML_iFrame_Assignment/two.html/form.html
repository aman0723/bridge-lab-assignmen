<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>

    <h2>Simple Form</h2>

    <iframe
        name="resultFrame"
        width="500"
        height="150"
        title="Result">
    </iframe>

    <br><br>

    <form action="result.html" method="get" target="resultFrame">

        <label>Enter your name:</label>

        <input type="text" name="name" required>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
