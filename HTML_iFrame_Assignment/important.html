<!DOCTYPE html>
<html>

<head>

    <!-- The title of the webpage shown in the browser tab -->
    <title>My Webpage</title>


    <!-- Specifies the character encoding -->
    <meta charset="UTF-8">


    <!-- Provides a description of the webpage -->
    <meta
        name="description"
        content="This is my sample HTML webpage.">


    <!-- Specifies the author of the webpage -->
    <meta
        name="author"
        content="Aman">


    <!-- Sets the base URL for relative URLs -->
    <base href="https://example.com/">


    <!-- Links an external resource such as a favicon -->
    <link
        rel="icon"
        href="favicon.ico">


    <!-- Used for CSS styling -->
    <style>

        /* CSS can be written here */

    </style>


    <!-- Used for JavaScript -->
    <script>

        // JavaScript can be written here

    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>
        This webpage demonstrates important HTML head elements.
    </p>

</body>
</html>
