<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Select Your Travel Preferences</h1>

    <!-- Country -->
    <label for="country">Country:</label>

    <select id="country">
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State -->
    <label for="state">State:</label>

    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Goa</option>
    </select>

    <br><br>

    <!-- City -->
    <label for="city">City:</label>

    <select id="city">
        <option selected>Agra</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
        <option>Delhi</option>
    </select>

    <br><br>

    <!-- Tourist Place -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Jaipur Palace</option>
        <option>Gateway of India</option>
        <option>Goa Beach</option>
    </select>

    <br><br>

    <!-- Summary -->
    <p>
        My choices are India, Uttar Pradesh, Agra,
        and Taj Mahal as my favorite tourist place.
    </p>

</body>
</html>
