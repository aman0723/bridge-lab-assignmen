<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Image Filter Comparison</h1>

    <div class="image-container">

        <div class="image-card">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800"
                 alt="Original Image">
            <h2>Original Image</h2>
            <p>Original image without any filter.</p>
        </div>

        <div class="image-card">
            <img class="filtered"
                 src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800"
                 alt="Filtered Image">
            <h2>Filtered Image</h2>
            <p>Brightness filter applied to this image.</p>
        </div>

    </div>

</body>
</html>
