<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Responsive CSS Cheat Sheet</h1>

    <div class="cheat-sheet">

        <div class="box">
            <h2>Filters</h2>
            <p>filter: grayscale(100%);</p>
        </div>

        <div class="box">
            <h2>Media Queries</h2>
            <p>@media (max-width: 700px)</p>
        </div>

        <div class="box">
            <h2>Responsive Design</h2>
            <p>Design websites that adapt to different screen sizes.</p>
        </div>

        <div class="box">
            <h2>Typography</h2>
            <p>font-size: clamp(1rem, 2vw, 2rem);</p>
        </div>

        <div class="box">
            <h2>CSS Grid</h2>
            <p>display: grid;</p>
        </div>

        <div class="box">
            <h2>Flexbox</h2>
            <p>display: flex;</p>
        </div>

    </div>

</body>
</html>
