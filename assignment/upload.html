<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>
</head>
<body>

    <h2>Upload Image</h2>

    <p>Only JPG and PNG image files are allowed.</p>

    <form>

        <label>Select an image:</label>

        <input
            type="file"
            name="image"
            accept=".jpg,.png">

        <br><br>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
