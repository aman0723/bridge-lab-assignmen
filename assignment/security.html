<!DOCTYPE html>
<html>
<head>
    <title>Secure Form</title>
</head>
<body>

    <h2>Secure Registration Form</h2>

    <form autocomplete="off">

        <label>Username:</label>
        <input
            type="text"
            name="username"
            required>

        <br><br>

        <label>Email:</label>
        <input
            type="email"
            name="email"
            required>

        <br><br>

        <label>Password:</label>
        <input
            type="password"
            name="password"
            required>

        <br><br>

        <input type="submit" value="Register">

    </form>

    <p>
        Turning off autocomplete can reduce the browser's automatic
        storage and filling of sensitive form information on shared
        or public computers. However, autocomplete="off" is not a
        complete security mechanism by itself.
    </p>

</body>
</html>
