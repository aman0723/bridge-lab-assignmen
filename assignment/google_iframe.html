<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h2>My City Map</h2>

    <!-- loading="lazy" loads the map only when it is close to being visible,
         which can improve page loading performance. -->

    <iframe
        title="Google Map"
        width="600"
        height="450"
        loading="lazy"
        src="https://www.google.com/maps?q=Delhi&output=embed">
    </iframe>

</body>
</html>
