<!DOCTYPE html>
<html>
<head>
    <title>Conference Schedule</title>
</head>
<body>

    <header>
        <h1>Technology Conference 2026</h1>
    </header>

    <table border="1">

        <caption>
            <b>Conference Schedule</b>
        </caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>

            <tr>
                <td>Morning</td>
                <td>10:00 AM</td>
                <td>Artificial Intelligence</td>
                <td>Dr. Sharma</td>
            </tr>

            <tr>
                <td>Afternoon</td>
                <td>2:00 PM</td>
                <td>Web Development</td>
                <td>Mr. Kumar</td>
            </tr>

            <tr>
                <td>Evening</td>
                <td>5:00 PM</td>
                <td>Future of Technology</td>
                <td>Ms. Priya</td>
            </tr>

        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="4">
                    Conference ends at 6:00 PM
                </td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
