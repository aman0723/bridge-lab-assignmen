<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage - Flexbox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            background-color: #f4f4f4;
        }

        /* Header */
        header {
            background-color: #222;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        header a:hover {
            color: #00bcd4;
        }

        /* Main */
        main {
            flex: 1;
            padding: 50px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .box {
            flex: 1;
            min-height: 200px;
            max-width: 350px;

            background-color: white;
            border-radius: 10px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 30px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

            transition: 0.3s;
        }

        /* Required hover rotation */
        .box:hover {
            transform: rotate(2deg);
        }

        .box h2 {
            margin-bottom: 15px;
        }

        .box p {
            line-height: 1.5;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 18px;
            width: 100%;
        }

        /* Responsive Design */
        @media (max-width: 700px) {

            main {
                flex-direction: column;
                padding: 30px 20px;
            }

            .box {
                width: 100%;
                max-width: 500px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </header>

    <!-- Main -->
    <main>

        <div class="box">
            <h2>Services</h2>
            <p>
                We provide web development and
                software development services.
            </p>
        </div>

        <div class="box">
            <h2>Projects</h2>
            <p>
                Explore our latest projects and
                creative development work.
            </p>
        </div>

        <div class="box">
            <h2>Contact</h2>
            <p>
                Get in touch with us for more
                information and collaboration.
            </p>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 My Homepage. All Rights Reserved.
    </footer>

</body>
</html>
