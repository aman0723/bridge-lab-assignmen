<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        /* Pricing Container */
        .pricing-container {
            width: 100%;
            max-width: 1100px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        /* Pricing Card */
        .pricing-card {
            flex: 1;
            max-width: 320px;
            min-height: 400px;

            background-color: white;
            padding: 35px 25px;

            border-radius: 12px;
            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);

            /* Fade-in animation */
            opacity: 0;
            animation: fadeIn 1s ease forwards;

            /* Smooth hover transition */
            transition: transform 0.3s ease;
        }

        /* Middle card */
        .pricing-card.featured {
            min-height: 440px;
            background-color: #dff6ff;
            transform: scale(1.05);
        }

        /* Hover Effect */
        .pricing-card:hover {
            transform: translateY(-10px);
        }

        .pricing-card.featured:hover {
            transform: scale(1.05) translateY(-10px);
        }

        /* Card Heading */
        .pricing-card h2 {
            margin-bottom: 20px;
            font-size: 26px;
        }

        /* Price */
        .price {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* Features */
        .pricing-card p {
            margin: 8px 0;
        }

        /* Button */
        .pricing-card button {
            margin-top: 25px;
            padding: 12px 25px;

            border: none;
            border-radius: 6px;

            background-color: #222;
            color: white;

            cursor: pointer;
        }

        .pricing-card button:hover {
            background-color: #444;
        }

        /* Fade-in Keyframes */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Delay for cards */
        .pricing-card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .pricing-card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .pricing-card:nth-child(3) {
            animation-delay: 0.6s;
        }

        /* Mobile */
        @media (max-width: 750px) {

            .pricing-container {
                flex-direction: column;
            }

            .pricing-card {
                width: 100%;
                max-width: 400px;
            }

            .pricing-card.featured {
                min-height: 400px;
                transform: none;
            }

            .pricing-card.featured:hover {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>

    <div class="pricing-container">

        <!-- Basic Plan -->
        <div class="pricing-card">
            <h2>Basic</h2>

            <div class="price">₹199</div>

            <p>1 User</p>
            <p>5 Projects</p>
            <p>10 GB Storage</p>

            <button>Choose Plan</button>
        </div>

        <!-- Premium Plan -->
        <div class="pricing-card featured">
            <h2>Premium</h2>

            <div class="price">₹499</div>

            <p>5 Users</p>
            <p>Unlimited Projects</p>
            <p>50 GB Storage</p>

            <button>Choose Plan</button>
        </div>

        <!-- Pro Plan -->
        <div class="pricing-card">
            <h2>Pro</h2>

            <div class="price">₹799</div>

            <p>10 Users</p>
            <p>Unlimited Projects</p>
            <p>100 GB Storage</p>

            <button>Choose Plan</button>
        </div>

    </div>

</body>
</html>
