<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Main registration section -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <!-- Responsive Bootstrap column -->
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center fw-bold mb-3">
                            Create Account
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Register yourself by filling in the form below.
                        </p>


                        <!-- Registration Form -->
                        <form>

                            <!-- Name -->
                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required
                                >

                            </div>


                            <!-- Gender -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <div>

                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="male"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="male">
                                            Male
                                        </label>

                                    </div>


                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="female"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="female">
                                            Female
                                        </label>

                                    </div>

                                </div>

                            </div>


                            <!-- Course -->
                            <div class="mb-3">

                                <label
                                    for="course"
                                    class="form-label">
                                    Select Course
                                </label>

                                <select
                                    id="course"
                                    class="form-select">

                                    <option selected>
                                        Choose a course
                                    </option>

                                    <option>
                                        Computer Science
                                    </option>

                                    <option>
                                        Data Science
                                    </option>

                                    <option>
                                        Artificial Intelligence
                                    </option>

                                    <option>
                                        Web Development
                                    </option>

                                </select>

                            </div>


                            <!-- Terms -->
                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required
                                >

                                <label
                                    class="form-check-label"
                                    for="terms">
                                    I agree to the terms and conditions.
                                </label>

                            </div>


                            <!-- Submit button -->
                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">
                                    Register
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center text-muted py-3">

        <p class="mb-0">
            © 2026 Registration Portal
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
