<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Header -->
    <header class="container text-center py-5">

        <h1 class="fw-bold">
            Our Products
        </h1>

        <p class="lead">
            Explore our latest products and choose your favorites.
        </p>

    </header>


    <!-- Product section -->
    <main class="container pb-5">

        <!-- Bootstrap row -->
        <div class="row g-4">


            <!-- Product 1 -->
            <!-- col-12 = mobile, col-md-6 = tablet, col-lg-3 = desktop -->
            <div class="col-12 col-md-6 col-lg-3">

                <div class="card h-100 shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
                        class="card-img-top"
                        alt="Running Shoes"
                    >

                    <div class="card-body text-center">

                        <h2 class="h5 card-title">
                            Running Shoes
                        </h2>

                        <p class="card-text fw-bold">
                            ₹2,499
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>


            <!-- Product 2 -->
            <div class="col-12 col-md-6 col-lg-3">

                <div class="card h-100 shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
                        class="card-img-top"
                        alt="Smart Watch"
                    >

                    <div class="card-body text-center">

                        <h2 class="h5 card-title">
                            Smart Watch
                        </h2>

                        <p class="card-text fw-bold">
                            ₹3,999
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>


            <!-- Product 3 -->
            <div class="col-12 col-md-6 col-lg-3">

                <div class="card h-100 shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                        class="card-img-top"
                        alt="Headphones"
                    >

                    <div class="card-body text-center">

                        <h2 class="h5 card-title">
                            Wireless Headphones
                        </h2>

                        <p class="card-text fw-bold">
                            ₹1,999
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>


            <!-- Product 4 -->
            <div class="col-12 col-md-6 col-lg-3">

                <div class="card h-100 shadow-sm">

                    <img
                        src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
                        class="card-img-top"
                        alt="T Shirt"
                    >

                    <div class="card-body text-center">

                        <h2 class="h5 card-title">
                            Cotton T-Shirt
                        </h2>

                        <p class="card-text fw-bold">
                            ₹799
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>


        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 Product Catalog
        </p>

    </footer>


    <!-- Bootstrap JavaScript CDN -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
