<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Outline &amp; Focus Styling Form</h1>
        <p>Demonstrating outline styles, <code>outline-offset</code>, dynamic <code>:focus</code> highlights, padding, and uniform field spacing.</p>
    </header>

    <main class="form-wrapper">
        <form class="styled-form">
            <h2>Interactive Inquiry Form</h2>

            <!-- Field 1: Solid Outline with Offset -->
            <div class="form-group">
                <label for="name">Full Name (Solid Outline with 3px offset):</label>
                <input type="text" id="name" class="field-solid" placeholder="Enter your full name" required>
            </div>

            <!-- Field 2: Dashed Outline on Focus -->
            <div class="form-group">
                <label for="email">Email Address (Dashed Outline on focus):</label>
                <input type="email" id="email" class="field-dashed" placeholder="you@domain.com" required>
            </div>

            <!-- Field 3: Double Outline on Focus -->
            <div class="form-group">
                <label for="subject">Subject (Double Outline on focus):</label>
                <input type="text" id="subject" class="field-double" placeholder="Project or topic...">
            </div>

            <!-- Field 4: Textarea with Offset Outline -->
            <div class="form-group">
                <label for="message">Detailed Message (Offset Outline):</label>
                <textarea id="message" class="field-textarea" rows="4" placeholder="Write your message here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </main>

    <footer>
        <p>CSS Model Practice - Question 9 &copy; 2026 Aman Mudgal</p>
    </footer>
</body>
</html>
