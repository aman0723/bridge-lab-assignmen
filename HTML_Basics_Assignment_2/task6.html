<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6 - Blockquote & Cite</title>
</head>
<body>
    <h1>Inspiring Quote</h1>
    <!-- Blockquote with author mentioned using cite tag -->
    <blockquote cite="https://en.wikipedia.org/wiki/Steve_Jobs">
        "Your work is going to fill a large part of your life, and the only way to be truly satisfied is to do what you believe is great work. And the only way to do great work is to love what you do."
    </blockquote>
    <p>— <cite>Steve Jobs</cite>, Stanford Commencement Address</p>
</body>
</html>
