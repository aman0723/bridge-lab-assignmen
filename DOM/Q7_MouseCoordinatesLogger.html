<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7: Detect Mouse Path & Coordinates Logger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f1f5f9;
            color: #1e293b;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 580px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            text-align: left;
        }
        .header h1 {
            font-size: 1.5rem;
            color: #0f172a;
        }
        .header p {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
        }
        .badge {
            display: inline-block;
            background: #fee2e2;
            color: #991b1b;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        /* Exact 400x400 Box Container */
        .mouse-tracking-box {
            width: 400px;
            height: 400px;
            border: 3px dashed #94a3b8;
            border-radius: 12px;
            background: radial-gradient(circle, #f8fafc 10%, #e2e8f0 90%);
            position: relative;
            cursor: crosshair;
            overflow: hidden;
            user-select: none;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: border-color 0.2s;
        }
        .mouse-tracking-box:hover {
            border-color: #ef4444;
        }
        .center-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #cbd5e1;
            font-size: 0.85rem;
            pointer-events: none;
            font-weight: 600;
        }
        /* Red Dot dropped on dblclick */
        .red-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ef4444;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
            animation: dotDrop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes dotDrop {
            from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        /* Live Coordinate Readout */
        .telemetry-card {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .telemetry-item {
            text-align: center;
        }
        .telemetry-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .telemetry-val {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.25rem;
            font-weight: 800;
            color: #ef4444;
            margin-top: 2px;
        }
        .controls-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }
        .dot-counter {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
        }
        .btn-clear {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-clear:hover {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }
        .nav-back {
            align-self: flex-start;
            margin-top: 20px;
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .nav-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">Question 7 • Mouse Events</span>
        <h1>Detect Mouse Path & Coordinates</h1>
        <p>Live clientX & clientY logger in 400×400 box. Double-click inside drops a red dot.</p>
    </div>

    <!-- 400px x 400px Tracking Box -->
    <div class="mouse-tracking-box" id="trackBox">
        <div class="center-crosshair">Double-click anywhere to drop red dot</div>
    </div>

    <!-- Telemetry Readout -->
    <div class="telemetry-card">
        <div class="telemetry-item">
            <div class="telemetry-label">Screen clientX</div>
            <div class="telemetry-val" id="valClientX">0 px</div>
        </div>
        <div class="telemetry-item">
            <div class="telemetry-label">Screen clientY</div>
            <div class="telemetry-val" id="valClientY">0 px</div>
        </div>
    </div>

    <div class="controls-row">
        <div class="dot-counter" id="dotCounter">Red dots dropped: 0</div>
        <button class="btn-clear" id="clearDotsBtn">Clear All Dots</button>
    </div>

    <a href="index.html" class="nav-back">← Back to All DOM Assignments</a>
</div>

<script src="Q7_MouseCoordinatesLogger.js"></script>
</body>
</html>
