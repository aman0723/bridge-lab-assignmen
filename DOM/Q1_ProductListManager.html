<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1: Dynamic Product List Manager (Event Delegation)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f1f5f9;
            color: #1e293b;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .header {
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        .header h1 {
            font-size: 1.5rem;
            color: #0f172a;
        }
        .header p {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
        }
        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-add {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add:hover {
            background: #2563eb;
        }
        .product-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .product-item:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .product-name {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            flex: 1;
            word-break: break-all;
            padding-right: 12px;
        }
        .inline-edit-input {
            flex: 1;
            padding: 6px 10px;
            border: 2px solid #3b82f6;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-right: 12px;
            outline: none;
            background: #ffffff;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn-edit {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-edit:hover {
            background: #fde68a;
        }
        .btn-delete {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-delete:hover {
            background: #fecaca;
        }
        .empty-msg {
            text-align: center;
            color: #94a3b8;
            padding: 24px 0;
            font-size: 0.9rem;
        }
        .nav-back {
            display: inline-block;
            margin-top: 20px;
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .nav-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">Question 1 • Event Delegation</span>
        <h1>Dynamic Product List Manager</h1>
        <p>Add, inline edit, and delete products. Single event listener on parent &lt;ul&gt;.</p>
    </div>

    <!-- Product Input Form -->
    <div class="input-group">
        <input type="text" id="newProductInput" placeholder="Enter product name (e.g., Wireless Mouse)..." autofocus>
        <button class="btn-add" id="addProductBtn">Add Product</button>
    </div>

    <!-- Product List (Parent for Event Delegation) -->
    <ul class="product-list" id="productList">
        <li class="product-item">
            <span class="product-name">Apple MacBook Pro 16"</span>
            <div class="actions">
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>
            </div>
        </li>
        <li class="product-item">
            <span class="product-name">Sony WH-1000XM5 Headphones</span>
            <div class="actions">
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>
            </div>
        </li>
        <li class="product-item">
            <span class="product-name">Logitech MX Master 3S</span>
            <div class="actions">
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>
            </div>
        </li>
    </ul>

    <a href="index.html" class="nav-back">← Back to All DOM Assignments</a>
</div>

<script src="Q1_ProductListManager.js"></script>
</body>
</html>
